<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- full-bleed background required for maskable icons (no rounded corners — the OS applies its own mask shape) -->
  <rect width="512" height="512" fill="#2B7FFF"/>

  <!-- icon scaled down further and centered within the ~80% safe zone so it survives circular/squircle cropping -->
  <g transform="translate(147.2, 137.6) scale(7.68)">
    <rect x="2" y="8" width="20" height="24" rx="2.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="6" y="5" width="20" height="24" rx="2.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.9"/>
    <rect x="10" y="2" width="20" height="24" rx="2.5" fill="#ffffff" stroke="#1e40af" stroke-width="0.8"/>
  </g>
</svg>
