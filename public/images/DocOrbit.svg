<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="transparent"/>

  <!-- orbit ellipse -->
  <ellipse cx="200" cy="185" rx="90" ry="32" fill="none" stroke="#B5D4F4" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- folder body -->
  <rect x="162" y="148" width="76" height="56" rx="6" fill="#185FA5"/>
  <!-- folder tab -->
  <rect x="162" y="138" width="32" height="14" rx="4" fill="#378ADD"/>
  <!-- folder lines -->
  <line x1="174" y1="166" x2="228" y2="166" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="174" y1="178" x2="228" y2="178" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="174" y1="190" x2="210" y2="190" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- orbit dots -->
  <circle cx="290" cy="185" r="8" fill="#378ADD"/>
  <circle cx="290" cy="185" r="4" fill="#E6F1FB"/>

  <circle cx="110" cy="185" r="6" fill="#B5D4F4"/>
  <circle cx="110" cy="185" r="3" fill="#185FA5"/>

  <circle cx="200" cy="153" r="5" fill="#0C447C"/>
  <circle cx="200" cy="217" r="5" fill="#0C447C"/>

  <!-- wordmark -->
  <text x="200" y="268"
        font-family="Inter, system-ui, sans-serif"
        font-size="32"
        font-weight="700"
        fill="#0C447C"
        text-anchor="middle"
        letter-spacing="-0.8">DocOrbit</text>

  <!-- tagline -->
  <text x="200" y="298"
        font-family="Inter, system-ui, sans-serif"
        font-size="13"
        font-weight="400"
        fill="#378ADD"
        text-anchor="middle"
        letter-spacing="3">FILE MANAGEMENT</text>

  <!-- subtle bottom rule -->
  <rect x="140" y="312" width="120" height="2" rx="1" fill="#B5D4F4"/>
</svg>
